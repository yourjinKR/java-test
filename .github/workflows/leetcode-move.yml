name: Move LeetCode Solutions

on:
  workflow_dispatch:  # 수동 실행 옵션
  push:
    paths:
      - '[0-9][0-9][0-9][0-9]-*/**'  # LeetHub가 생성하는 폴더 패턴

# Action 봇이 리포지토리에 변경사항을 push 하기 위해 필수적인 쓰기 권한
permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 최신 버전인 v4 사용 권장
        with:
          fetch-depth: 2

      - name: Move LeetCode solutions
        run: |
          echo "Current directory contents:"
          ls -la
          
          # 목표 경로를 변수로 설정
          TARGET_DIR="src/main/java/org/example/leetcode"
          
          # 해당 경로까지 필요한 모든 폴더를 생성
          mkdir -p "$TARGET_DIR"
          
          echo "Changed files in this push:"
          git diff --name-only HEAD^ HEAD || true
          
          found=0
          for d in [0-9][0-9][0-9][0-9]-*; do
            if [ -d "$d" ]; then
              echo "Moving directory: $d to $TARGET_DIR"
              # 누락되었던 실제 이동 명령어 추가 및 경로 지정
              mv "$d" "$TARGET_DIR/" && found=1
            fi
          done
          
          if [ $found -eq 0 ]; then
            echo "No matching directories found to move"
          fi

      - name: Commit & Push changes
        run: |
          if git status --porcelain | grep .; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m "chore: Move LeetCode solutions to src/main/java/org/example/leetcode"
            git push
          else
            echo "No changes to commit"
          fi